[workspace]
members = [
    "app",
    "core",
    "artisan",
    "database",
    "macros",
    "macros-core",
    "integration-tests",
    #    "graveyard", # uncomment this workspace carfully this not for production
]
resolver = "2"

[workspace.package]
rust-version = "1.94"
version = "0.1.0"

[workspace.dependencies]

# ── Runtime / Async ───────────────────────────────
tokio = { version = "1.53", features = ["full"] }
futures = "0.3"

# ── Web Framework / HTTP / FORM ──────────────────────────
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.12.6", features = ["routing", "typed-routing"] }
tower = "0.5.3" # middleware / layers
axum-params = "0.4"
tower-http = {version = "0.7" , features = ["full"]}
futures-util = "0.3"

# ── Templates / Views + Code genrate ─────────────────────────────
minijinja = { version = "3", features = [
    "builtins",
    "macros",
    "multi_template",
    "serde",
    "json",
    "urlencode",
    "loop_controls",
] } # Jinja-like templates

# ── Database / Persistence / fake ────────────────────────
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "mysql", "sqlite", "postgres", "macros", "time"] }
fake =  { git = "https://github.com/cksac/fake-rs.git", branch = "master", features = ["time","http"] } # TODO: change after new release
# ── Serialization / Data ──────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── CLI / Config ──────────────────────────────────
clap = { version = "4.6", features = ["derive"] }
dotenv = "0.15.0" # env loading (dev)

# ── Utilities / Glue ──────────────────────────────
once_cell = "1.21.4"     # lazy statics
async-trait = "0.1.92"   # async in traits

# ── Time / Date ───────────────────────────────────
time = { version = "0.3", features = ["macros", "parsing", "formatting", "local-offset", "serde", "serde-human-readable"] } # modern time handling

# ── String and utilty  ─────────────────────────
regex = "1.13.1" # str
illuminate-str = "0.3" #str
rand = "0.10" #random

# ── Terminal / UX ─────────────────────────
colored = "3"
terminal_size = "0.4"
ansi-str = "0.9"
dialoguer = "0.12"

# ── Crypto / Security ─────────────────────
ring = "0.17"            # crypto + secure hash
subtle = "2"  # Constant-time comparison
crc32fast = "1.5"        # cheap integrity hash
argon2 = { version = "0.6", features = ["kdf", "getrandom"] } # expensive password crypter
bcrypt = "0.19" # cheaper password crypter
# ── Encoding / Web ────────────────────────
data-encoding = "2.11"    # binary encodings
percent-encoding = "2.3" # URL encode/decode

# ── handle genreal error ────────────────────────
anyhow = "1"
thiserror = "2"

# ── mail & cache ────────────────────────
lettre = { version = "0.11.23", features = ["builder", "smtp-transport", "sendmail-transport", "pool", "hostname", "tokio1", "tokio1-native-tls", "ring", "webpki-roots"] }